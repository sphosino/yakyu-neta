<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>プロ野球 ネタ九回勝負</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 手書き式スコアボードを頭に、下のカードが「ホーム→1イニング1ネタ→試合終了」と切り替わる。図鑑と用語集は下から出るシート */
:root{
  --bg:#e9ece3; --surface:#f7f8f3; --fg:#1d2419; --muted:#5d6656; --line:#cdd3c4;
  --board:#1f3a2a; --board-ink:#f1f0e6; --cell:#0e2016; --lamp:#f2c230; --accent:#1f6b44; --accent-ink:#ffffff;
  --good:#1f7a45; --bad:#b23a2e; --note:#fbf3d2; --note-ink:#3a3212; --talk:#e3efe6; --talk-ink:#183322;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111611; --surface:#1a211a; --fg:#e6eadf; --muted:#9aa492; --line:#2d372b;
  --board:#183022; --board-ink:#f1f0e6; --cell:#0b1910; --lamp:#f2c230; --accent:#5fbf86; --accent-ink:#0d1a12;
  --good:#6fcf93; --bad:#ef7b6c; --note:#2c2914; --note-ink:#f3e7b4; --talk:#16271c; --talk-ink:#cfe8d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111611; --surface:#1a211a; --fg:#e6eadf; --muted:#9aa492; --line:#2d372b;
  --board:#183022; --board-ink:#f1f0e6; --cell:#0b1910; --lamp:#f2c230; --accent:#5fbf86; --accent-ink:#0d1a12;
  --good:#6fcf93; --bad:#ef7b6c; --note:#2c2914; --note-ink:#f3e7b4; --talk:#16271c; --talk-ink:#cfe8d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,6.5vw,38px);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top-btns{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.pill:hover{border-color:var(--accent)}
.pill small{font-weight:500;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.board-scroll{overflow-x:auto;border-radius:6px}
.board{background:var(--board);color:var(--board-ink);border-collapse:separate;border-spacing:3px;padding:8px;width:100%;min-width:360px;font-variant-numeric:tabular-nums}
.board th{font-weight:500;font-size:11px;letter-spacing:.08em;opacity:.75;padding:2px 0}
.board th.rowh{text-align:left;padding-right:4px;white-space:nowrap}
.board td{background:var(--cell);font-family:var(--display);font-size:18px;text-align:center;height:36px;min-width:26px;border-radius:2px;color:var(--board-ink)}
.board td.now{outline:2px solid var(--lamp);outline-offset:-2px}
.board td.total{color:var(--lamp);min-width:40px}
.board tr.hee td{font-size:13px;height:24px;font-family:var(--body);font-weight:700;color:var(--lamp)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.tag{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.tag b{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:3px;letter-spacing:.05em}
.tag .fan{background:var(--lamp);color:#1d2419;padding:2px 8px;border-radius:3px;letter-spacing:.04em}
.link{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent);margin:-6px 0 -4px}
.link::before{content:"";width:18px;height:2px;background:var(--accent);border-radius:2px}
.nick{font-family:var(--display);font-size:clamp(28px,8vw,44px);line-height:1.15;margin:0;text-wrap:balance}
.nick small{display:block;font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:0;text-wrap:balance}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
button{font:inherit;cursor:pointer}
.ch{background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;font-weight:500;line-height:1.5;min-width:0}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.ch.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.ch b{display:block;font-size:17px}
.ch .sub2{display:block;font-size:13px;color:var(--muted);margin-top:2px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 18px;font-weight:700;align-self:flex-start}
.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:8px;padding:10px 16px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.result{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--display);font-size:22px}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.new{white-space:nowrap;display:inline-block;font-family:var(--body);font-size:12px;font-weight:700;background:var(--lamp);color:#1d2419;border-radius:3px;padding:1px 7px;margin-left:8px;vertical-align:middle;letter-spacing:.06em}
.who{font-weight:700;font-size:15px;color:var(--muted)}
.who b{color:var(--fg);font-size:18px}
.story{margin:0}
.tane{background:var(--note);color:var(--note-ink);border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.65}
.tane span,.talk span{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.75;margin-bottom:2px}
.talk{background:var(--talk);color:var(--talk-ink);border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.65;position:relative}
.talk q{quotes:"「" "」"}
.hee-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hee-row p{margin:0;font-size:13px;color:var(--muted);width:100%}
.hee-btn{border-radius:999px;padding:8px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.hee-btn.main{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 22%,var(--bg))}
.hee-btn:disabled{cursor:default;opacity:.55}
.hee-btn.on{opacity:1;outline:2px solid var(--lamp)}
/* ホーム */
.today{background:var(--board);color:var(--board-ink);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.today .lbl{font-size:12px;letter-spacing:.12em;opacity:.8;font-weight:700}
.today .nm{font-family:var(--display);font-size:24px;color:var(--lamp);line-height:1.3}
.today p{margin:0;font-size:14px}
.today .go{background:var(--lamp);color:#1d2419;margin-top:6px}
.sec{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:4px 0 -6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:700}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--lamp)}
/* 試合終了 */
.end-score{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.end-score div{display:flex;flex-direction:column}
.end-score b{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.end-score span{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.rank{font-family:var(--display);font-size:22px;color:var(--accent);margin:0}
.book{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.book li{background:var(--note);color:var(--note-ink);border-radius:6px;padding:10px 14px;font-size:15px;line-height:1.6}
.book li b{display:block;font-size:13px;letter-spacing:.04em}
.book li.flag b::after{content:"へぇ";margin-left:8px;font-size:11px;padding:1px 6px;border-radius:3px;background:var(--lamp);color:#1d2419}
.chain{font-size:14px;line-height:2;color:var(--muted)}
.chain b{color:var(--fg)}
.chain i{font-style:normal;color:var(--accent);font-weight:700;font-size:12px;margin:0 2px}
.copy-out{width:100%;min-height:160px;font:inherit;font-size:13px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);padding:10px}
.msg{font-size:13px;color:var(--accent);font-weight:700;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 0}
.fade{animation:in .35s ease-out}
@keyframes in{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:420px){.choices.two{grid-template-columns:1fr}.top{flex-direction:column}.top-btns{justify-content:flex-start}}
/* 用語：タップで説明 */
.term{all:unset;cursor:pointer;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;border-radius:2px}
.term:hover{background:color-mix(in srgb,var(--lamp) 25%,transparent)}
.term.person{text-decoration-style:solid;text-decoration-thickness:1.5px;font-weight:inherit}
.pop.wide{width:min(360px,calc(100vw - 32px));max-height:min(70vh,560px);overflow-y:auto}
.pop .py{display:block;font-size:12px;opacity:.75;margin:-2px 0 8px}
.pop .pf{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 8px;font-size:13px}
.pop .pf dt{opacity:.7;white-space:nowrap}
.pop .pf dd{margin:0}
.pop .pd{margin:0 0 10px}
.pop .ph{margin:0 0 6px;font-size:12px;letter-spacing:.1em;opacity:.8;font-weight:700;border-top:1px solid color-mix(in srgb,var(--board-ink) 25%,transparent);padding-top:10px}
.pop .rels{display:flex;flex-wrap:wrap;gap:6px}
.pop .rel{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;border:1.5px solid var(--lamp);background:transparent;color:var(--lamp)}
.pop button.rel:hover{background:color-mix(in srgb,var(--lamp) 20%,transparent)}
.pop .rel.locked{border-style:dashed;border-color:color-mix(in srgb,var(--board-ink) 40%,transparent);color:color-mix(in srgb,var(--board-ink) 60%,transparent);font-weight:500}
.gl-nick{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
.dex .who-line{font-size:13px;color:var(--muted)}
.dex details.hit{border-color:var(--lamp);box-shadow:0 0 0 2px color-mix(in srgb,var(--lamp) 40%,transparent)}
.term:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
.tane .term,.book .term{text-decoration-color:color-mix(in srgb,var(--note-ink) 60%,transparent)}
.talk .term{text-decoration-color:color-mix(in srgb,var(--talk-ink) 55%,transparent)}
.pop{position:absolute;z-index:40;width:min(320px,calc(100vw - 32px));background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:14px;line-height:1.7}
.pop .pt{font-family:var(--display);font-size:18px;color:var(--lamp);display:block;margin-bottom:2px;padding-right:28px}
.pop .pc{display:inline-block;font-size:11px;letter-spacing:.1em;opacity:.7;margin-bottom:4px}
.pop .px{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--board-ink);font-size:18px;line-height:1}
/* シート（図鑑・用語集） */
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 45%,transparent);display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
.sheet-panel{background:var(--surface);color:var(--fg);width:100%;max-width:640px;max-height:88%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;flex-direction:column;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-head .top{align-items:center;flex-direction:row}
.sheet-head h2{font-size:22px}
.sheet-head input{font:inherit;font-size:14px;padding:6px 10px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.sheet-x{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 14px;font-weight:700;flex:none}
.sheet-body{overflow-y:auto;padding:8px 20px 24px}
.sheet-body h3{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:18px 0 6px}
.sheet-body dl{margin:0;display:flex;flex-direction:column;gap:10px}
.sheet-body dt{font-weight:700}
.sheet-body dd{margin:0;font-size:14px;color:var(--muted);line-height:1.7}
.empty{color:var(--muted);font-size:14px;padding-top:12px}
.dex{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.dex details{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.dex summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dex summary::-webkit-details-marker{display:none}
.dex summary b{font-size:16px}
.dex summary span{font-size:12px;color:var(--muted)}
.dex summary em{font-style:normal;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--lamp);color:#1d2419}
.dex .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.dex .body p{margin:0}
.dex .locked{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.dex .locked b{font-family:var(--display);font-weight:400;letter-spacing:.1em}
.reset{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.reset button{font-size:13px;padding:6px 12px;border-radius:6px;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.reset button.danger{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top"><h1>プロ野球 ネタ九回勝負</h1>
      <div class="top-btns"><button class="pill" id="dexOpen">図鑑<small id="dexCount"></small></button><button class="pill" id="glOpen">用語集</button></div>
    </div>
    <p>1イニングにつき野球ネタをひとつ。あだ名の由来、名場面、球場や助っ人のウラ話を当てると1点。答えたあとに出る話と「切り出し方」は、そのまま誰かに話せます。点線の言葉はタップすると意味が出ます。</p>
  </header>
  <div class="board-scroll"><table class="board" id="board" aria-label="スコアボード"></table></div>
  <section class="card" id="card" aria-live="polite"></section>
</div>
<div class="pop" id="pop" role="dialog" hidden></div>
<div class="sheet" id="gl" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="glTitle">
    <div class="sheet-head"><div class="top"><h2 id="glTitle">用語集</h2><button class="sheet-x" data-close="gl">閉じる</button></div>
      <input id="glq" type="search" placeholder="言葉をさがす" aria-label="用語をさがす"></div>
    <div class="sheet-body" id="glBody"></div>
  </div>
</div>
<div class="sheet" id="dex" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="dexTitle">
    <div class="sheet-head"><div class="top"><h2 id="dexTitle">ネタ図鑑</h2><button class="sheet-x" data-close="dex">閉じる</button></div>
      <div class="prog" id="dexProg"></div>
      <div class="chips" id="dexChips"></div></div>
    <div class="sheet-body" id="dexBody"></div>
  </div>
</div>

<script src="gloss.js"></script>
<script src="neta.js"></script>
<script src="people.js"></script>
<script>
/* ===== 基本 ===== */
const $ = id => document.getElementById(id);
const card = () => $("card");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const sum = a => a.reduce((x,v)=>x+(v||0),0);
const escH = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BYID = Object.fromEntries(NETA.map(d=>[d.id,d]));
const PLAY_URL = "https://sphosino.github.io/yakyu-neta/";
const TEAMS = [["G","巨人"],["T","阪神"],["D","中日"],["C","広島"],["S","ヤクルト"],["DB","DeNA"],["H","ソフトバンク"],["L","西武"],["Bs","オリックス"],["M","ロッテ"],["F","日本ハム"],["E","楽天"]];
const TEAMNAME = Object.fromEntries(TEAMS);
const GEN = [["young","20〜30代",d=>d.y>=1995],["mid","40〜50代",d=>d.y>=1975&&d.y<=2010],["old","60代以上",d=>d.y<=1990]];
const GENRES = [["あだ名",["あだ名"]],["名場面",["名場面"]],["球場・応援",["球場・応援"]],["助っ人・球団・ウラ話",["助っ人","球団・背番号","ウラ話"]]];
const dateLabel = md => { const [m,d] = md.split("-").map(Number); return `${m}月${d}日`; };

/* ===== 図鑑の記録（この端末のブラウザに保存）===== */
const KEY = "yakyuNeta.dex.v1";
let DEX = {};
try { DEX = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { DEX = {}; }
const saveDex = () => { try { localStorage.setItem(KEY, JSON.stringify(DEX)); } catch(e) {} };
const dexN = () => NETA.filter(d=>DEX[d.id]).length;
const drawDexCount = () => { $("dexCount").textContent = `${dexN()}/${NETA.length}`; };

/* ===== 用語（タップで説明）===== */
const TERM = {}, WHO = {};
/* 人物カードがある人は、用語集の同じ項目より人物カードを優先する */
Object.entries(PEOPLE).forEach(([k,p]) => { WHO[k] = k; (p.aka||[]).forEach(a => WHO[a] = k); });
Object.entries(GLOSS).forEach(([cat,o])=>Object.entries(o).forEach(([t,x])=>{ if (!WHO[t]) TERM[t]={cat,x}; }));
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const TERM_RE = new RegExp([...Object.keys(TERM), ...Object.keys(WHO)].sort((a,b)=>b.length-a.length).map(esc).join("|"),"g");
const L = s => s.replace(TERM_RE, m => WHO[m] ? `<button type="button" class="term person" data-p="${WHO[m]}">${m}</button>` : `<button type="button" class="term" data-t="${m}">${m}</button>`);
/* その人が出てくるネタ（タグか本文に名前がある） */
function related(k){
  const names = [k, ...(PEOPLE[k].aka||[])];
  return NETA.filter(d => (d.tags||[]).includes(k) || names.some(n => [d.name,d.q,d.story,d.tane].some(s => s && s.includes(n))));
}
const pop = $("pop");
let popFrom = null;
function personHTML(k){
  const p = PEOPLE[k], rel = related(k), got = rel.filter(d=>DEX[d.id]).length;
  const list = rel.map(d => DEX[d.id] ? `<button class="rel" data-id="${d.id}">${d.nick}</button>` : `<span class="rel locked">？？？</span>`).join("");

/* ===== 今日は何の日 ===== */
function todayPick(){
  const now = new Date();
  const doy = (m,d) => Math.round((Date.UTC(2001,m-1,d) - Date.UTC(2001,0,1)) / 864e5);
  const t = doy(now.getMonth()+1, now.getDate());
  let best = null;
  NETA.filter(d=>d.date).forEach(d => {
    const [m,dd] = d.date.split("-").map(Number);
    let diff = doy(m,dd) - t;
    if (diff > 182) diff -= 365; if (diff < -182) diff += 365;
    if (!best || Math.abs(diff) < Math.abs(best.diff) || (Math.abs(diff)===Math.abs(best.diff) && diff<0)) best = {d, diff};
  });
  const same = shuffle(NETA.filter(d => d.date===best.d.date));
  return { d: same[0], diff: best.diff, also: same.slice(1), m: now.getMonth()+1, day: now.getDate() };
}

/* ===== 試合 ===== */
function nextLinked(prev, used){
  const cands = [];
  NETA.forEach(d => { if (used.has(d.id)) return; const shared = (d.tags||[]).filter(t => (prev.tags||[]).includes(t)); if (shared.length) cands.push({d, tag:shared[0]}); });
  if (cands.length) return cands[Math.floor(Math.random()*cands.length)];
  NETA.forEach(d => { if (used.has(d.id)) return; const shared = (d.teams||[]).filter(t => (prev.teams||[]).includes(t)); if (shared.length) cands.push({d, tag:TEAMNAME[shared[0]]}); });
  if (cands.length) return cands[Math.floor(Math.random()*cands.length)];
  const rest = NETA.filter(d=>!used.has(d.id));
  return {d: rest[Math.floor(Math.random()*rest.length)], tag:null};
}
function start(opt){
  let items = [], links = Array(9).fill(null);
  if (opt.mode==="today"){ const head = [opt.first, ...(opt.also||[])]; items = [...head, ...shuffle(NETA.filter(d=>!head.includes(d)))].slice(0,9); }
  else if (opt.mode==="genre") items = shuffle(NETA.filter(d=>GENRES[opt.gi][1].includes(d.g))).slice(0,9);
  else if (opt.mode==="match"){
    const g = GEN.find(x=>x[0]===opt.gen);
    items = NETA.map(d => ({d, s:(opt.team&&(d.teams||[]).includes(opt.team)?3:0) + (g&&g[2](d)?2:0) + Math.random()*1.5}))
      .sort((a,b)=>b.s-a.s).slice(0,9).map(x=>x.d);
    items = shuffle(items);
  }
  else if (opt.mode==="chain"){
    const used = new Set(); let cur = NETA[Math.floor(Math.random()*NETA.length)];
    items.push(cur); used.add(cur.id);
    for (let i=1;i<9;i++){ const nx = nextLinked(cur, used); items.push(nx.d); links[i] = nx.tag; used.add(nx.d.id); cur = nx.d; }
  }
  else items = shuffle(NETA).slice(0,9);
  S = {mode:opt.mode, team:opt.team||null, inn:0, items, links, runs:Array(9).fill(null), hee:Array(9).fill(null), done:false, fresh:Array(9).fill(false)};
  render();
}

function answer(d, btn){
  let ok;

  if (d.f==="tf"){
    ok = (btn.dataset.v==="1") === d.tf;
    all.forEach(x => { x.disabled = true; const v = x.dataset.v==="1"; if (v===d.tf) x.classList.add("right"); else if (x===btn) x.classList.add("wrong"); });
  } else {
    ok = +btn.dataset.i === d.ans;
    all.forEach(x => { x.disabled = true; const i = +x.dataset.i; if (i===d.ans) x.classList.add("right"); else if (x===btn) x.classList.add("wrong"); });
  }
  S.runs[S.inn] = ok ? 1 : 0;
  const isNew = !DEX[d.id];
  S.fresh[S.inn] = isNew;
  DEX[d.id] = {...(DEX[d.id]||{}), ok: (DEX[d.id]&&DEX[d.id].ok) || ok, n: ((DEX[d.id]&&DEX[d.id].n)||0)+1};
  saveDex(); drawDexCount(); drawBoard();
  const verdict = d.f==="tf" ? (ok ? `正解！ 答えは「${d.tf?"ホント":"ウソ"}」` : `残念、答えは「${d.tf?"ホント":"ウソ"}」`) : (ok ? "正解！ 1点追加" : "残念、ここは0点");
  card().insertAdjacentHTML("beforeend", `<div class="result fade">
    <div class="verdict ${ok?"ok":"ng"}">${verdict}${isNew?`<span class="new">図鑑に追加</span>`:""}</div>
    <div class="who">${d.g==="あだ名" ? `「${d.nick}」＝<b>${L(d.name)}</b>` : `<b>${d.nick}</b>　${L(d.name)}`}</div>

    <div class="talk"><span>切り出し方</span><q>${L(d.open)}</q></div>

      <button class="hee-btn main" data-h="1">へぇ〜</button><button class="hee-btn" data-h="0">知ってた</button></div>
  </div>`);
  card().querySelectorAll(".hee-btn").forEach(b => b.onclick = () => {
    const h = b.dataset.h==="1";
    S.hee[S.inn] = h;
    if (h) { DEX[d.id].hee = true; saveDex(); }
    card().querySelectorAll(".hee-btn").forEach(x => { x.disabled = true; if (x===b) x.classList.add("on"); });
    drawBoard();
    const last = S.inn===8;
    let label = last ? "試合終了" : `${S.inn+2}回へ`;

    const n = $("next");
    n.onclick = () => { if (last) S.done = true; else S.inn++; render(); };
    n.focus({preventScroll:true});
  });
}

    const fallback = () => {
      out.innerHTML = `<p class="msg">自動でコピーできなかったので、下の文を選んでコピーしてください。</p><textarea class="copy-out" id="copyTa" readonly></textarea>`;
      const ta = $("copyTa"); ta.value = text; ta.focus(); ta.select();
    };
    try {
      navigator.clipboard.writeText(text).then(() => { out.innerHTML = `<p class="msg">コピーしました。LINEなどにそのまま貼れます。</p>`; }, fallback);
    } catch(e) { fallback(); }
  };
  fadeIn();
}

home();
</script>
</body>
</html>
