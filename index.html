<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>プロ野球 ネタ九回勝負</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 手書き式スコアボード（得点＝正解）を頭に、1イニング=1つのあだ名。答えると由来の話と「話のタネ」が出て、最後にタネ帳にまとまる */
:root{
  --bg:#e9ece3; --surface:#f7f8f3; --fg:#1d2419; --muted:#5d6656; --line:#cdd3c4;
  --board:#1f3a2a; --board-ink:#f1f0e6; --cell:#0e2016; --lamp:#f2c230; --accent:#1f6b44; --accent-ink:#ffffff;
  --good:#1f7a45; --bad:#b23a2e; --note:#fbf3d2; --note-ink:#3a3212;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111611; --surface:#1a211a; --fg:#e6eadf; --muted:#9aa492; --line:#2d372b;
  --board:#183022; --board-ink:#f1f0e6; --cell:#0b1910; --lamp:#f2c230; --accent:#5fbf86; --accent-ink:#0d1a12;
  --good:#6fcf93; --bad:#ef7b6c; --note:#2c2914; --note-ink:#f3e7b4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111611; --surface:#1a211a; --fg:#e6eadf; --muted:#9aa492; --line:#2d372b;
  --board:#183022; --board-ink:#f1f0e6; --cell:#0b1910; --lamp:#f2c230; --accent:#5fbf86; --accent-ink:#0d1a12;
  --good:#6fcf93; --bad:#ef7b6c; --note:#2c2914; --note-ink:#f3e7b4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,6.5vw,38px);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.board-scroll{overflow-x:auto;border-radius:6px}
.board{background:var(--board);color:var(--board-ink);border-collapse:separate;border-spacing:3px;padding:8px;width:100%;min-width:360px;font-variant-numeric:tabular-nums}
.board th{font-weight:500;font-size:11px;letter-spacing:.08em;opacity:.75;padding:2px 0}
.board th.rowh{text-align:left;padding-right:4px;white-space:nowrap}
.board td{background:var(--cell);font-family:var(--display);font-size:18px;text-align:center;height:36px;min-width:26px;border-radius:2px;color:var(--board-ink)}
.board td.now{outline:2px solid var(--lamp);outline-offset:-2px}
.board td.total{color:var(--lamp);min-width:40px}
.board tr.hee td{font-size:13px;height:24px;font-family:var(--body);font-weight:700;color:var(--lamp)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.tag{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.tag b{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:3px;letter-spacing:.05em}
.nick{font-family:var(--display);font-size:clamp(30px,8vw,44px);line-height:1.15;margin:0;text-wrap:balance}
.nick small{display:block;font-family:var(--body);font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:0;text-wrap:balance}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
button{font:inherit;cursor:pointer}
.ch{background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;font-weight:500;line-height:1.5;min-width:0}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch:focus-visible,.go:focus-visible,.hee-btn:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.ch:disabled{cursor:default}
.ch.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.ch.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 18px;font-weight:700;align-self:flex-start}
.result{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--display);font-size:22px}
.verdict.ok{color:var(--good)} .verdict.ng{color:var(--bad)}
.who{font-weight:700;font-size:15px;color:var(--muted)}
.who b{color:var(--fg);font-size:18px}
.story{margin:0}
.tane{background:var(--note);color:var(--note-ink);border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.65}
.tane span{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.75;margin-bottom:2px}
.hee-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hee-row p{margin:0;font-size:13px;color:var(--muted);width:100%}
.hee-btn{border-radius:999px;padding:8px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.hee-btn.main{border-color:var(--lamp);background:color-mix(in srgb,var(--lamp) 22%,var(--bg))}
.hee-btn:disabled{cursor:default;opacity:.55}
.hee-btn.on{opacity:1;outline:2px solid var(--lamp)}
.end-score{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.end-score div{display:flex;flex-direction:column}
.end-score b{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.end-score span{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.rank{font-family:var(--display);font-size:22px;color:var(--accent);margin:0}
.book{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.book li{background:var(--note);color:var(--note-ink);border-radius:6px;padding:10px 14px;font-size:15px;line-height:1.6}
.book li b{display:block;font-size:13px;letter-spacing:.04em}
.book li.flag b::after{content:"へぇ";margin-left:8px;font-size:11px;padding:1px 6px;border-radius:3px;background:var(--lamp);color:#1d2419}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 0}
.fade{animation:in .35s ease-out}
@keyframes in{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:420px){.choices.two{grid-template-columns:1fr}}
/* 用語：タップで説明 */
.term{all:unset;cursor:pointer;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;border-radius:2px}
.term:hover{background:color-mix(in srgb,var(--lamp) 25%,transparent)}
.term:focus-visible{outline:2px solid var(--lamp);outline-offset:1px}
.tane .term,.book .term{text-decoration-color:color-mix(in srgb,var(--note-ink) 60%,transparent)}
.pop{position:absolute;z-index:20;width:min(320px,calc(100vw - 32px));background:var(--board);color:var(--board-ink);border-radius:8px;padding:14px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:14px;line-height:1.7}
.pop .pt{font-family:var(--display);font-size:18px;color:var(--lamp);display:block;margin-bottom:2px;padding-right:28px}
.pop .pc{display:inline-block;font-size:11px;letter-spacing:.1em;opacity:.7;margin-bottom:4px}
.pop .px{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--board-ink);font-size:18px;line-height:1}
.pop .px:focus-visible{outline:2px solid var(--lamp)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gl-open{flex:none;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.gl-open:hover{border-color:var(--accent)}
.gl-open:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.gl{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 45%,transparent);display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
.gl-panel{background:var(--surface);color:var(--fg);width:100%;max-width:640px;max-height:85%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.gl-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px;border-bottom:1px solid var(--line);gap:12px}
.gl-head h2{font-size:22px}
.gl-head input{flex:1;min-width:0;max-width:220px;font:inherit;font-size:14px;padding:6px 10px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.gl-body{overflow-y:auto;padding:8px 20px 24px}
.gl-body h3{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:18px 0 6px}
.gl-body dl{margin:0;display:flex;flex-direction:column;gap:10px}
.gl-body dt{font-weight:700}
.gl-body dd{margin:0;font-size:14px;color:var(--muted);line-height:1.7}
.gl-x{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 14px;font-weight:700}
.gl-empty{color:var(--muted);font-size:14px;padding-top:12px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top"><h1>プロ野球 ネタ九回勝負</h1><button class="gl-open" id="glOpen">用語集</button></div>
    <p>1イニングにつき、野球ネタをひとつ。あだ名の由来、名場面、球場や応援のウラ話を当てると1点。答えたあとに出る話は、そのまま誰かに話せるネタです。点線の言葉はタップすると意味が出ます。</p>
  </header>
  <div class="board-scroll"><table class="board" id="board" aria-label="スコアボード"></table></div>
  <section class="card" id="card" aria-live="polite"></section>
</div>
<div class="pop" id="pop" role="dialog" aria-live="polite" hidden></div>
<div class="gl" id="gl" hidden>
  <div class="gl-panel" role="dialog" aria-modal="true" aria-labelledby="glTitle">
    <div class="gl-head"><h2 id="glTitle">用語集</h2><input id="glq" type="search" placeholder="言葉をさがす" aria-label="用語をさがす"><button class="gl-x" id="glClose">閉じる</button></div>
    <div class="gl-body" id="glBody"></div>
  </div>
</div>

<script>
/* ===== あだ名データ（由来は各種報道・資料で確認したもの）=====
 f: who=誰のあだ名？ / origin=由来はどれ？ / tf=ホント？ウソ？ / custom=独自の問い */
const D = [
 {nick:"ゴジラ", name:"松井秀喜", f:"origin",
  q:"松井秀喜が「ゴジラ」と呼ばれるようになったきっかけは？",
  opts:["高校時代、スポーツ紙の記者が笑顔の歯並びと豪快な打球を怪獣に重ねて書いた","巨人の入団会見で、ゴジラの着ぐるみを着て登場した","少年時代、怪獣映画ばかり観ていて担任の先生に付けられた"], ans:0,
  story:"星稜高校時代、1992年のセンバツ直前に、スポーツ紙の記者が紙面で初めて「ゴジラ」と書いたのが始まり。取材中の愛嬌ある笑顔や歯並びが怪獣の顔と重なり、体格と飛距離もぴったりだったそうです。本人は最初この呼び名を嫌がっていました。",
  tane:"エンゼルスに移ってからは、赤いユニフォームにちなんで「赤ゴジラ」とも呼ばれた。"},
 {nick:"ハマの大魔神", name:"佐々木主浩", f:"origin",
  q:"佐々木主浩が「大魔神」と呼ばれるようになった理由は？",
  opts:["記者が「悪魔の守護神」を縮めて「魔神」と書き、顔つきが映画の大魔神に似ていて定着した","登場曲が映画『大魔神』のテーマだった","マウンドで仁王立ちしてまったく表情を変えなかった"], ans:0,
  story:"1994年、巨人担当のスポーツ紙記者が、相手から見た佐々木を「悪魔の守護神」、略して「魔神」と表現。そこに風貌が大映映画の大魔神に似ていたことが重なりました。1998年の横浜優勝で「ハマの大魔神」は流行語大賞にも選ばれています。",
  tane:"長嶋茂雄さんは佐々木の名前を覚えておらず、いつも「魔神君」と呼んでいたらしい。"},
 {nick:"8時半の男", name:"宮田征典", f:"origin",
  q:"巨人・宮田征典の「8時半の男」。名付けたきっかけは？",
  opts:["後楽園球場の場内アナウンス担当が、登板がいつも夜8時半ごろだと気づいた","毎朝8時半ぴったりに球場入りしていた","試合後の門限が8時半と決められていた"], ans:0,
  story:"1965年、リリーフ専門で投げた宮田の登板が決まって夜8時半ごろだったことに、後楽園球場で場内アナウンスを担当していた務台鶴さんが気づいたのが始まり。この年はリーグ最多の69試合に登板して20勝を挙げました。",
  tane:"リリーフ専門投手が注目されるきっかけを作った人。あだ名の名付け親は場内アナウンスの担当者。"},
 {nick:"G.G.佐藤", name:"佐藤隆彦", f:"origin",
  q:"西武などで活躍した「G.G.佐藤」。G.G.の意味は？",
  opts:["顔が「ジジくさい」から","「グレート・ゴリラ」の頭文字","「ゴールデングラブを2回とる」という目標から"], ans:0,
  story:"本名は佐藤隆彦。G.G.は「爺（じじ）」から来ていて、本人いわく理由は顔がジジくさいから。",
  tane:"後輩に「ジャイアント・ゴリラの略ですか？」と聞かれて、「それはひどい」と返したそう。"},
 {nick:"月見草", name:"野村克也", f:"origin",
  q:"野村克也が自分を「月見草」にたとえた、そもそもの理由は？",
  opts:["通算600号の日、パ・リーグの記事が小さくなるのを見越して、記者が食いつく言葉を用意した","趣味で月見草を育てていた","ナイターにめっぽう強かった"], ans:0,
  story:"1975年、通算600号本塁打を打った試合後のこと。当時のパ・リーグは人気がなく、普通に話しても記事は小さい。そこで「ONがヒマワリなら、オレは月見草」と語り、見事に話題をさらいました。",
  tane:"あの名言は、地味な扱いを逆手にとった計算ずくの言葉だった。"},
 {nick:"ハマの番長", name:"三浦大輔", f:"tf",
  q:"三浦大輔は「番長」というあだ名を、最初から気に入っていた。",
  tf:false,
  story:"プロ1〜2年目にスポーツ紙の見出しで使われ始めたものの、本人は「正直ダサい」と思い、新聞社に使わないよう頼んだほど。考えが変わったのは、ファンの小さな女の子に「ハマの番長！」と声をかけられたときでした。",
  tane:"リーゼントは、中高時代に夢中になった不良マンガ『ビー・バップ・ハイスクール』への憧れから。"},
 {nick:"ギータ", name:"柳田悠岐", f:"origin",
  q:"柳田悠岐の「ギータ」。誰が、なぜ付けた？",
  opts:["新人時代に川崎宗則が「名前が言いにくい」と言って付けた","ギターが趣味で、遠征先にも持ち歩いていた","フルスイングでバットが「ギーッ」と鳴るから"], ans:0,
  story:"新人だった柳田たちをキャンプ中の食事に連れ出した川崎宗則が、名前が言いにくいからと「ギータ」と呼んだのが始まり。翌日のノックでもそう呼ばれ、チームからファンまで広まりました。",
  tane:"ギータの名付け親はムネリンこと川崎宗則。"},
 {nick:"おかわり君", name:"中村剛也", f:"origin",
  q:"中村剛也の「おかわり君」。由来は？",
  opts:["先輩に好きな言葉を聞かれて「おかわり」と答えた","ホームランを打つたびにベンチで「おかわり！」と叫んだ","寮の食堂で丼を10杯食べた"], ans:0,
  story:"若手のころ、先輩に「好きな言葉は？」と聞かれて答えたのが「おかわり」。キャンプの声出しでも同じことを言ってアピールし、そのまま定着しました。",
  tane:"本人が自分から言い出した言葉が、そのままあだ名になった珍しいケース。"},
 {nick:"ライアン", name:"小川泰弘", f:"origin",
  q:"ヤクルト・小川泰弘が「ライアン」と呼ばれる本当の理由は？",
  opts:["当時の監督も小川さんだったので、区別するために本人が希望した","足を高く上げるフォームがノーラン・ライアンそっくりだから","ノーラン・ライアンに手紙を書いたら返事が来たから"], ans:0,
  story:"入団時の監督が同じ姓の小川淳司さんだったため、区別するために本人が希望したあだ名です。足を高く上げるフォームのほうは、高校時代にノーラン・ライアンの本を読んで作り上げたもの。",
  tane:"「フォームが似てるから」と思われがちだけど、実は監督と名字がかぶったのがきっかけ。"},
 {nick:"神様、仏様、稲尾様", name:"稲尾和久", f:"tf",
  q:"「神様、仏様、稲尾様」は、1958年の日本シリーズ中に地元紙・西日本スポーツが打った見出しだと確認されている。",
  tf:false,
  story:"巨人に3連敗から4連勝した1958年の日本シリーズが由来とよく言われます。ところが西日本スポーツが自社の紙面を調べたところ、シリーズ期間中にその見出しは見つかりませんでした。誰がいつ言い出したかは、意外とはっきりしていません。",
  tane:"超有名なフレーズなのに、出どころは今も謎が残っている。"},
 {nick:"赤バット", name:"川上哲治", f:"origin",
  q:"「打撃の神様」川上哲治の赤バット。赤く塗ったいきさつは？",
  opts:["バットメーカーに頼まれて塗った","血豆がつぶれてバットが赤く染まった","審判から見やすいように球団が指示した"], ans:0,
  story:"戦後、大下弘の「青バット」と並んで流行語になった赤バット。川上によると、メーカーに頼まれて塗ったもので、塗料がボールについてしまうため後に禁止されました。",
  tane:"戦前にも一度あって、巨人のえび茶色を頼んだら塗料のせいで赤っぽくなったのが始まり。"},
 {nick:"ギャオス", name:"内藤尚行", f:"origin",
  q:"ヤクルト・内藤尚行の「ギャオス」。由来は？",
  opts:["ブルペンで雄叫びを上げるので、首脳陣に「ギャーオ」と呼ばれた","怪獣映画にエキストラで出演した","口ぐせが「ギャオス！」だった"], ans:0,
  story:"ブルペンで投げるたびに雄叫びを上げるので、首脳陣が「ギャーオ」と呼ぶようになり、それがガメラの怪獣の名前「ギャオス」に変化しました。引退後もそのまま芸名にしています。",
  tane:"入団したばかりのころは、体と顔の大きさから「フランケン」と呼ばれていた。"},
 {nick:"ハンカチ王子", name:"斎藤佑樹", f:"tf",
  q:"斎藤佑樹は「ハンカチ王子」と呼ばれるのが好きだった。",
  tf:false,

const TERM = {};
Object.entries(GLOSS).forEach(([cat,o])=>Object.entries(o).forEach(([t,x])=>TERM[t]={cat,x}));
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const TERM_RE = new RegExp(Object.keys(TERM).sort((a,b)=>b.length-a.length).map(esc).join("|"),"g");
const L = s => s.replace(TERM_RE, m => `<button type="button" class="term" data-t="${m}">${m}</button>`);

const pop = document.getElementById("pop");
let popFrom = null;
function showPop(el){
  const t = el.dataset.t, g = TERM[t];
  pop.innerHTML = `<button class="px" aria-label="閉じる">×</button><span class="pc">${g.cat}</span><span class="pt">${t}</span>${g.x}`;
  pop.hidden = false;
  const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(Math.max(16, r.left), document.documentElement.clientWidth - w - 16);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8 && r.top - h - 8 > 8) top = r.top - h - 8;
  pop.style.left = (left + window.scrollX) + "px";
  pop.style.top = (top + window.scrollY) + "px";
  popFrom = el;
  pop.querySelector(".px").onclick = hidePop;
}
function hidePop(){ if (!pop.hidden){ pop.hidden = true; if (popFrom) popFrom.focus({preventScroll:true}); popFrom = null; } }
document.addEventListener("click", e => {
  const t = e.target.closest(".term");
  if (t){ e.preventDefault(); if (popFrom===t) hidePop(); else showPop(t); return; }
  if (!e.target.closest("#pop")) { pop.hidden = true; popFrom = null; }
});
window.addEventListener("resize", () => { pop.hidden = true; popFrom = null; });

const gl = document.getElementById("gl"), glq = document.getElementById("glq");
function drawGloss(){
  const q = glq.value.trim();
  let html = "";
  Object.entries(GLOSS).forEach(([cat,o])=>{
    const rows = Object.entries(o).filter(([t,x]) => !q || t.includes(q) || x.includes(q));
    if (rows.length) html += `<h3>${cat}</h3><dl>${rows.map(([t,x])=>`<div><dt>${t}</dt><dd>${x}</dd></div>`).join("")}</dl>`;
  });
  document.getElementById("glBody").innerHTML = html || `<p class="gl-empty">「${q.replace(/[<>&"]/g,"")}」に当てはまる言葉はありません。</p>`;
}
function openGloss(){ pop.hidden = true; drawGloss(); gl.hidden = false; document.getElementById("glClose").focus(); }
function closeGloss(){ gl.hidden = true; document.getElementById("glOpen").focus({preventScroll:true}); }
document.getElementById("glOpen").onclick = openGloss;
document.getElementById("glClose").onclick = closeGloss;
gl.addEventListener("click", e => { if (e.target===gl) closeGloss(); });
glq.addEventListener("input", drawGloss);
document.addEventListener("keydown", e => { if (e.key==="Escape"){ if (!gl.hidden) closeGloss(); else hidePop(); } });

let S;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const MODES = [
  {id:"mix", t:"ごちゃまぜ", s:"あだ名も名場面もウラ話も", pick:()=>D},
  {id:"nick", t:"あだ名で勝負", s:"選手のあだ名と、その由来", pick:()=>D.filter(d=>d.g==="あだ名")},
  {id:"other", t:"名場面・球場・ウラ話", s:"あだ名以外の、語りたくなる話", pick:()=>D.filter(d=>d.g!=="あだ名")}
];
function startMenu(){
  S = {menu:true, inn:0, runs:Array(9).fill(null), hee:Array(9).fill(null), done:false};

  card().innerHTML = `<div class="tag"><b>プレイボール</b></div><p class="q">どのネタで勝負する？</p>
    <div class="choices">${MODES.map(m=>`<button class="ch mode" data-m="${m.id}"><b>${m.t}</b><span class="num" style="font-family:var(--body);font-size:13px">${m.s}（${m.pick().length}ネタから9つ）</span></button>`).join("")}</div>`;
  card().querySelectorAll(".mode").forEach(b => b.onclick = () => newGame(b.dataset.m));

function newGame(mode){
  const m = MODES.find(x=>x.id===mode) || MODES[0];
  S = {mode:m.id, inn:0, items:shuffle(m.pick()).slice(0,9), runs:Array(9).fill(null), hee:Array(9).fill(null), done:false};
  render();
}
const card = () => document.getElementById("card");
const sum = a => a.reduce((x,v)=>x+(v||0),0);

function drawBoard(){
  let h = "<tr><th></th>";
  for (let i=1;i<=9;i++) h += `<th>${i}</th>`;
  h += "<th>計</th></tr><tr><th class='rowh'>得点</th>";
  S.runs.forEach((v,i)=>{ h += `<td class="${i===S.inn&&!S.done?"now":""}">${v===null?"":v}</td>`; });
  h += `<td class="total">${sum(S.runs)}</td></tr><tr class="hee"><th class='rowh'>へぇ</th>`;
  S.hee.forEach(v=>{ h += `<td>${v?"●":""}</td>`; });
  h += `<td class="total">${S.hee.filter(Boolean).length}</td></tr>`;
  document.getElementById("board").innerHTML = h;
}

const LABEL = {who:"誰のあだ名？", origin:"由来はどれ？", tf:"ホント？ウソ？"};
function render(){
  drawBoard();
  if (S.done) return renderEnd();
  const d = S.items[S.inn];
  const isNick = d.g==="あだ名";
  const nickLine = (isNick && d.f==="who") ? "" : `<p class="nick"><small>${isNick?"今回のあだ名":`今回のネタ｜${d.g}`}</small>${d.nick}</p>`;
  let body;
  if (d.f==="tf"){
    body = `<div class="choices two"><button class="ch" data-v="1">ホント</button><button class="ch" data-v="0">ウソ</button></div>`;
  } else {
    const order = shuffle(d.opts.map((t,i)=>i));
    body = `<div class="choices">${order.map(i=>`<button class="ch" data-i="${i}">${d.opts[i]}</button>`).join("")}</div>`;
  }
  card().innerHTML = `<div class="tag"><span>${S.inn+1}回</span><b>${LABEL[d.f]}</b></div>${nickLine}<p class="q">${L(d.q)}</p>${body}`;
  pop.hidden = true;
  card().querySelectorAll(".ch").forEach(btn => btn.onclick = () => answer(d, btn));
  card().classList.remove("fade"); void card().offsetWidth; card().classList.add("fade");
}

function answer(d, btn){
  let ok;
  const all = card().querySelectorAll(".ch");
  if (d.f==="tf"){
    ok = (btn.dataset.v==="1") === d.tf;
    all.forEach(x => { x.disabled = true; const v = x.dataset.v==="1"; if (v===d.tf) x.classList.add("right"); else if (x===btn) x.classList.add("wrong"); });
  } else {
    ok = +btn.dataset.i === d.ans;
    all.forEach(x => { x.disabled = true; const i = +x.dataset.i; if (i===d.ans) x.classList.add("right"); else if (x===btn) x.classList.add("wrong"); });
  }
  S.runs[S.inn] = ok ? 1 : 0;
  drawBoard();
  const verdict = d.f==="tf" ? (ok ? `正解！ 答えは「${d.tf?"ホント":"ウソ"}」` : `残念、答えは「${d.tf?"ホント":"ウソ"}」`) : (ok ? "正解！ 1点追加" : "残念、ここは0点");
  card().insertAdjacentHTML("beforeend", `<div class="result fade">
    <div class="verdict ${ok?"ok":"ng"}">${verdict}</div>
    <div class="who">${d.g==="あだ名" ? `「${d.nick}」＝<b>${d.name}</b>` : `<b>${d.nick}</b>　${d.name}`}</div>
    <p class="story">${L(d.story)}</p>
    <div class="tane"><span>話のタネ</span>${L(d.tane)}</div>
    <div class="hee-row"><p>この話、知ってましたか？</p>
      <button class="hee-btn main" data-h="1">へぇ〜</button><button class="hee-btn" data-h="0">知ってた</button></div>
  </div>`);
  card().querySelectorAll(".hee-btn").forEach(b => b.onclick = () => {
    S.hee[S.inn] = b.dataset.h==="1";
    card().querySelectorAll(".hee-btn").forEach(x => { x.disabled = true; if (x===b) x.classList.add("on"); });
    drawBoard();
    const last = S.inn===8;
    card().querySelector(".result").insertAdjacentHTML("beforeend", `<button class="go" id="next">${last?"試合終了":`${S.inn+2}回へ`}</button>`);
    const n = document.getElementById("next");
    n.onclick = () => { if (last) S.done = true; else S.inn++; render(); };
    n.focus({preventScroll:true});
  });
}

function renderEnd(){
  const r = sum(S.runs), h = S.hee.filter(Boolean).length;
  const ranks = [[9,"完全試合","野球のウラ話まで知り尽くしています。解説席からお声がかかるレベル。"],[7,"エース級","かなりの通です。飲みの席で一目置かれます。"],[5,"クリーンナップ","しっかり野球を見てきた人の数字です。"],[3,"レギュラー争い","今日拾ったネタで、次はもっと点が取れます。"],[0,"ベンチスタート","知らなかった分だけ、話せるネタが増えました。"]];
  const rk = ranks.find(x => r>=x[0]);
  const heeLine = h>=6 ? "へぇが多いほど、明日話せるネタが多いということ。" : h>=3 ? "人に話したくなるネタが、いくつか拾えました。" : "ほとんど知ってたとは、相当な野球通です。";
  const book = S.items.map((d,i)=>`<li class="${S.hee[i]?"flag":""}"><b>${d.g==="あだ名" ? `${d.nick}（${d.name}）` : d.nick}</b>${L(d.tane)}</li>`).join("");
  card().innerHTML = `<div class="tag"><b>試合終了</b></div>
    <div class="end-score"><div><b>${r}</b><span>得点 / 9</span></div><div><b>${h}</b><span>へぇ</span></div></div>
    <div><p class="rank">${L(rk[1])}</p><p style="margin:2px 0 0">${L(rk[2])}${heeLine}</p></div>
    <h2>今日の話のタネ帳</h2><p class="sub">「へぇ」を付けた話から、誰かに振ってみてください。</p>
    <ul class="book">${book}</ul>
    <button class="go" id="again">もう一試合（ネタが入れ替わります）</button>`;
  document.getElementById("again").onclick = startMenu;
  card().classList.remove("fade"); void card().offsetWidth; card().classList.add("fade");
}
startMenu();
</script>
</body>
</html>
